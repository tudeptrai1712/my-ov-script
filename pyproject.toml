[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovchat"
version = "0.2.0"
description = "High-performance local AI inference suite and OpenAI-compatible API server for OpenVINO GenAI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenVINO GenAI Suite" }
]
keywords = ["openvino", "genai", "llm", "vlm", "intel-arc", "openai-api", "open-webui"]
dependencies = [
    "openvino>=2025.0.0",
    "openvino-genai>=2025.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pypdf>=3.9.0",
    "pypdfium2>=4.0.0",
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ovchat = "ovchat.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovchat*"]

